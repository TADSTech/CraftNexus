<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftNexus - Create Project</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/project.css">
</head>
<body>
    <header>
        <nav>
            <img src="../assets/logo.png" alt="CraftNexus Logo" class="logo">
            <ul>
                <li><a href="explore_artisan.html">Explore</a></li>
                <li><a href="project.html" class="active">Create Project</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="../backend/logout.php">Log Out</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="project-section">
            <h1>Create a Project</h1>
            <p>Submit a project request to collaborate with an artisan.</p>
            <form action="../backend/project_request.php" method="POST" class="project-form">
                <div class="form-group">
                    <label for="artisan">Select Artisan</label>
                    <select id="artisan" name="artisan_id" required>
                        <option value="">Choose an artisan</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Project Title</label>
                    <input type="text" id="title" name="title" required placeholder="Enter project title">
                </div>
                <div class="form-group">
                    <label for="description">Project Description</label>
                    <textarea id="description" name="description" required placeholder="Describe your project"></textarea>
                </div>
                <button type="submit" class="cta-button">Submit Project</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CraftNexus. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/project.js"></script>
</body>
</html>
