<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftNexus - Sign Up</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <nav>
            <img src="../assets/logo.png" alt="CraftNexus Logo" class="logo">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="artisans.html">Find Artisans</a></li>
                <li><a href="project.html">Start a Project</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="signup-section">
            <h1>Sign Up for CraftNexus</h1>
            <p>Join our community as an artisan or entrepreneur!</p>
            <form action="../backend/signup.php" method="POST" class="signup-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Register As</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="user_type" value="artisan" required> I want to be hired (Artisan)
                        </label>
                        <label>
                            <input type="radio" name="user_type" value="non_artisan" required> I want to hire (Entrepreneur)
                        </label>
                    </div>
                </div>
                <button type="submit" class="cta-button">Sign Up</button>
            </form>
            <p>Already have an account? <a href="login.html">Log in here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CraftNexus. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
