<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftNexus - Log In</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <nav>
            <img src="../assets/logo.png" alt="CraftNexus Logo" class="logo">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="artisans.html">Find Artisans</a></li>
                <li><a href="project.html">Start a Project</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <h1>Log In to CraftNexus</h1>
            <p>Access your account to connect and collaborate!</p>
            <form action="../backend/auth.php" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="cta-button">Log In</button>
            </form>
            <p>Don't have an account? <a href="signup.html">Sign up here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CraftNexus. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
